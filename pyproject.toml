[project]
name = "tidymac"
version = "0.1.0"
description = "macOS upgrade + cleanup TUI — runs every task in parallel with per-task progress bars"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "rafapolo" }]
keywords = ["macos", "cleanup", "cache", "homebrew", "tui", "textual", "maintenance"]
classifiers = [
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Systems Administration",
]
dependencies = ["textual>=0.80"]

[project.urls]
Homepage = "https://github.com/rafapolo/tidymac"
Issues = "https://github.com/rafapolo/tidymac/issues"

[project.scripts]
tidymac = "tidymac:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["tidymac.py"]

[tool.hatch.build.targets.sdist]
include = ["tidymac.py", "README.md", "LICENSE", "docs/"]
